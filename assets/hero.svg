<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Job Countdown · 取代倒计时</title>
  <desc id="desc">你这就是 AI 的活儿，赶紧写交接文档吧。取代倒计时：AI 接班人来催交接，直接开怼，拿证据补刀。情景分析，非失业预测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111621"/><stop offset="1" stop-color="#182331"/></linearGradient>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <g font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
    <rect x="60" y="58" width="10" height="20" rx="3" fill="#b2f584"/>
    <text x="84" y="76" font-size="18" font-weight="600" letter-spacing="2" fill="#c3ccd6">AI JOB COUNTDOWN</text>
    <text x="60" y="185" font-size="58" font-weight="700" fill="#f5f7fa">你这就是</text>
    <text x="60" y="264" font-size="58" font-weight="700" fill="#b2f584">AI 的活儿。</text>
    <text x="60" y="343" font-size="50" font-weight="700" fill="#f5f7fa">赶紧写交接文档吧。</text>
    <text x="64" y="412" font-size="23" fill="#bac5d2">取代倒计时 · AI 接班人来催你交接了。</text>
    <rect x="64" y="460" width="156" height="44" rx="22" fill="#263240"/>
    <text x="142" y="489" font-size="18" text-anchor="middle" fill="#e5ebf1">哪块先倒霉</text>
    <rect x="232" y="460" width="156" height="44" rx="22" fill="#263240"/>
    <text x="310" y="489" font-size="18" text-anchor="middle" fill="#e5ebf1">条件时间窗</text>
    <rect x="400" y="460" width="156" height="44" rx="22" fill="#263240"/>
    <text x="478" y="489" font-size="18" text-anchor="middle" fill="#e5ebf1">30 天自救</text>
    <rect x="712" y="105" width="508" height="434" rx="20" fill="#1c2937" stroke="#3b4b5e"/>
    <text x="744" y="151" font-size="16" fill="#a8b6c6" letter-spacing="2">WORK / REWIRED</text>
    <text x="744" y="204" font-size="30" font-weight="600" fill="#f5f7fa">别给手动操作加戏了。</text>
    <path d="M744 232H1188" stroke="#3b4b5e"/>
    <text x="744" y="278" font-size="20" fill="#a8b6c6">先交哪块</text><text x="852" y="278" font-size="22" fill="#f5f7fa">模板留下，流程写清。</text>
    <text x="744" y="335" font-size="20" fill="#a8b6c6">还卡在哪</text><text x="852" y="335" font-size="22" fill="#f5f7fa">别把 IT 欠账当护城河。</text>
    <text x="744" y="392" font-size="20" fill="#a8b6c6">还剩什么</text><text x="852" y="392" font-size="22" fill="#b2f584">拿出它交不了的那份卷。</text>
    <rect x="744" y="442" width="444" height="60" rx="10" fill="#111c26"/>
    <text x="966" y="479" font-size="19" text-anchor="middle" fill="#cbd8e6">情景分析，非失业预测</text>
    <text x="64" y="587" font-size="17" fill="#91a2b6">AGENT SKILL · OPEN SOURCE · MIT</text>
  </g>
</svg>
